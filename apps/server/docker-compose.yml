# INFORMACIÓN
# Los servicios de este archivo no usan los puertos por defecto, para evitar
# conflictos con otros servicios de tu máquina.
# Si no tienes nada en los puertos por defecto, puedes exponerlos cambiando la
# sección ports de cada servicio. No olvides cambiar también los puertos en el .env.

# El nombre de proyecto explícito separa los contenedores y volúmenes de este
# proyecto de los de otros, aunque este archivo esté en una carpeta con el mismo
# nombre (p. ej. apps/server en otro monorepo). Va entre comillas para que un nombre
# que parezca un número (p. ej. "123") siga siendo texto: Compose rechaza nombres no textuales.
name: 'tienda-suple-30ab1ace'

services:
    postgres_db:
        image: postgres:16-alpine
        volumes:
            - postgres_db_data:/var/lib/postgresql/data
        ports:
            - "6543:5432"
        environment:
            POSTGRES_DB: vendure
            POSTGRES_USER: vendure
            POSTGRES_PASSWORD: jGT9azVWyRPVK3whzCUKjg
        labels:
            - "io.vendure.create.name=tienda suple"

    mysql_db:
        image: mysql:8
        volumes:
            - mysql_db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: 'ROOT'
            MYSQL_DATABASE: vendure
            MYSQL_USER: vendure
            MYSQL_PASSWORD: jGT9azVWyRPVK3whzCUKjg
        ports:
            - "4306:3306"
        labels:
            - "io.vendure.create.name=tienda suple"

    mariadb_db:
        image: mariadb:10
        volumes:
            - mariadb_db_data:/var/lib/mysql
        environment:
            MARIADB_ROOT_PASSWORD: 'ROOT'
            MARIADB_DATABASE: vendure
            MARIADB_USER: vendure
            MARIADB_PASSWORD: jGT9azVWyRPVK3whzCUKjg
        ports:
            - "3306:3306"
        labels:
            - "io.vendure.create.name=tienda suple"

    # RECOMENDADO (sobre todo en producción)
    # ¿Usar BullMQ con Redis en vez de la cola de trabajos en base de datos por defecto?
    # Ver el plugin BullMQ: https://docs.vendure.io/reference/core-plugins/job-queue-plugin/bull-mqjob-queue-plugin/
    redis:
        image: redis:7-alpine
        ports:
            - "6479:6379"
        volumes:
            - redis_data:/data
        labels:
            - "io.vendure.create.name=tienda suple"

    # RECOMENDADO
    # ¿Usar Typesense en vez del buscador por defecto?
    # Ver el plugin de búsqueda avanzada: https://vendure.io/hub/vendure-plus-advanced-search-plugin
    # Para arrancar el contenedor de typesense: "docker compose up -d typesense"
    typesense:
        image: typesense/typesense:27.0
        command: [ '--data-dir', '/data', '--api-key', 'SuperSecret' ]
        ports:
            - "8208:8108"
        volumes:
            - typesense_data:/data
        labels:
            - "io.vendure.create.name=tienda suple"

    # ¿Usar Elasticsearch en vez del buscador en base de datos por defecto?
    # Ver el plugin Elasticsearch de la comunidad: https://github.com/vendurehq/vendure-community-plugins
    # Para arrancar el contenedor de elasticsearch: "docker compose up -d elasticsearch"
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        container_name: elasticsearch
        environment:
            - node.name=es
            - cluster.name=es-docker-cluster
            - xpack.security.enabled=false
            - xpack.security.http.ssl.enabled=false
            - xpack.security.transport.ssl.enabled=false
            - xpack.license.self_generated.type=basic
            - discovery.type=single-node
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        mem_limit: 536870912
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        ports:
            - 9200:9200
        labels:
            - "io.vendure.create.name=tienda suple"

volumes:
    postgres_db_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
    mysql_db_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
    mariadb_db_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
    typesense_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
    elasticsearch_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
    redis_data:
        driver: local
        labels:
            - "io.vendure.create.name=tienda suple"
