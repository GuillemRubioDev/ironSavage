name: tienda-suple-prod

# Sistema con forma de producción, pensado para verificarse en local antes de
# cualquier despliegue real. DOCKER_PRODUCTION.md explica la secuencia completa
# de arranque y por qué no basta con un `docker compose up -d --build`.
#
# Se ejecuta con: docker compose -f docker-compose.prod.yml --env-file .env.prod ...
# .env.prod nunca se sube al repo (ver .env.prod.example): todos los valores de
# abajo son sustituciones `${VAR}`, nunca secretos escritos.
#
# Cada servicio recibe solo las variables que necesita (una lista explícita en
# `environment:`, no un `env_file:` general): el contenedor del storefront nunca
# ve COOKIE_SECRET, DB_PASSWORD, REDSYS_SECRET_KEY, etc.

# Igual para todos los servicios de abajo: limita lo que pueden crecer
# `docker logs` (y los ficheros JSON de log en disco), para que un contenedor
# muy hablador o que se reinicia en bucle no llene el disco. 10 MB x 5 ficheros
# = 50 MB como máximo por servicio, suficiente historial para el volumen de esta
# tienda. json-file es el driver por defecto de Docker; esto solo añade rotación.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  tienda-net:
    driver: bridge

volumes:
  postgres_data:
  vendure_static:
  storefront_image_cache:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [tienda-net]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sin `ports:` a propósito: en producción Postgres no debe ser accesible
    # desde fuera de la red de Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  vendure-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks: [tienda-net]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      VENDURE_SERVER_PORT: "3000"
      COOKIE_SECRET: ${COOKIE_SECRET}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ASSET_URL_PREFIX: ${ASSET_URL_PREFIX}
      REDSYS_MERCHANT_CODE: ${REDSYS_MERCHANT_CODE}
      REDSYS_TERMINAL: ${REDSYS_TERMINAL}
      REDSYS_SECRET_KEY: ${REDSYS_SECRET_KEY}
      REDSYS_ENVIRONMENT: ${REDSYS_ENVIRONMENT}
      REDSYS_NOTIFICATION_URL: ${REDSYS_NOTIFICATION_URL}
      STOREFRONT_URL: ${STOREFRONT_URL}
      # Interno (red Docker): el servidor avisa al storefront de los cambios de
      # precio para refrescar su caché, sin salir a internet.
      STOREFRONT_REVALIDATE_URL: http://storefront:3001/api/revalidate
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      INVOICE_STORE_NAME: ${INVOICE_STORE_NAME}
      INVOICE_STORE_TAX_ID: ${INVOICE_STORE_TAX_ID}
      INVOICE_STORE_ADDRESS: ${INVOICE_STORE_ADDRESS}
      INVOICE_STORE_EMAIL: ${INVOICE_STORE_EMAIL}
      INVOICE_STORE_PHONE: ${INVOICE_STORE_PHONE:-}
      INVOICE_STORE_REGISTRY: ${INVOICE_STORE_REGISTRY:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_STORE_NAME: ${EMAIL_STORE_NAME:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    # Sin `ports:`: desde fuera solo se llega a Caddy; a vendure-server se
    # accede por la red interna tienda-net como `vendure-server:3000`.
    volumes:
      - vendure_static:/app/apps/server/static
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  vendure-worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "dist/index-worker.js"]
    restart: unless-stopped
    logging: *default-logging
    networks: [tienda-net]
    depends_on:
      vendure-server:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ASSET_URL_PREFIX: ${ASSET_URL_PREFIX}
      REDSYS_MERCHANT_CODE: ${REDSYS_MERCHANT_CODE}
      REDSYS_TERMINAL: ${REDSYS_TERMINAL}
      REDSYS_SECRET_KEY: ${REDSYS_SECRET_KEY}
      REDSYS_ENVIRONMENT: ${REDSYS_ENVIRONMENT}
      REDSYS_NOTIFICATION_URL: ${REDSYS_NOTIFICATION_URL}
      STOREFRONT_URL: ${STOREFRONT_URL}
      INVOICE_STORE_NAME: ${INVOICE_STORE_NAME}
      INVOICE_STORE_TAX_ID: ${INVOICE_STORE_TAX_ID}
      INVOICE_STORE_ADDRESS: ${INVOICE_STORE_ADDRESS}
      INVOICE_STORE_EMAIL: ${INVOICE_STORE_EMAIL}
      INVOICE_STORE_PHONE: ${INVOICE_STORE_PHONE:-}
      INVOICE_STORE_REGISTRY: ${INVOICE_STORE_REGISTRY:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_STORE_NAME: ${EMAIL_STORE_NAME:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    # Sin volumen static/: en este proyecto los recursos subidos y los PDF de
    # factura solo los escribe el proceso que atiende las peticiones HTTP
    # (vendure-server); hoy ningún trabajo del worker toca static/.
    healthcheck:
      # index-worker.ts arranca un servidor HTTP de salud real con
      # VendureWorker.startHealthCheckServer() de Vendure: refleja si el worker
      # funciona de verdad, no solo si el proceso existe (un proceso colgado
      # pasaría un simple pgrep).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3020/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      # Debe compilarse en la misma red que el vendure-server ya arrancado:
      # `next build` le pide datos al prerenderizar páginas (ver la nota al
      # principio de apps/storefront/Dockerfile). Aquí hace falta el nombre de
      # red completo y literal (el `name:` del principio de este archivo más la
      # clave de red de abajo), y compilar con el builder antiguo:
      # DOCKER_BUILDKIT=0 docker compose build storefront (el builder por defecto
      # de BuildKit no permite unirse a una red con nombre; solo `host`/`none`/la por defecto).
      network: tienda-suple-prod_tienda-net
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        # Indicador de entorno de la tienda (EnvironmentBadge): solo se ve en desarrollo.
        NEXT_PUBLIC_DEPLOY_ENV: ${DEPLOY_ENV:-production}
        VENDURE_SHOP_API_URL: http://vendure-server:3000/shop-api
        VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN}
        API_DOMAIN: ${API_DOMAIN}
    restart: unless-stopped
    logging: *default-logging
    networks: [tienda-net]
    depends_on:
      vendure-server:
        condition: service_healthy
    environment:
      VENDURE_SHOP_API_URL: http://vendure-server:3000/shop-api
      VENDURE_CHANNEL_TOKEN: ${VENDURE_CHANNEL_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
    # Solo la caché de next/image (no toda .next/cache: la de datos va ligada a cada
    # build). Así las imágenes ya optimizadas sobreviven a los despliegues y nadie
    # paga la generación en frío después de cada uno.
    volumes:
      - storefront_image_cache:/app/apps/storefront/.next/cache/images
    # Sin `ports:`: desde fuera solo se llega a través de Caddy; internamente
    # es `storefront:3001`.
    healthcheck:
      # 127.0.0.1 y no localhost: el wget de busybox resuelve localhost primero
      # a ::1, y el servidor solo escucha en IPv4 (ver la nota de HOSTNAME en
      # apps/storefront/Dockerfile), así que ::1 se rechaza.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [tienda-net]
    depends_on:
      vendure-server:
        condition: service_healthy
      storefront:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Se ejecuta como root (lo que trae la imagen oficial) para usar los puertos
    # 80/443 y gestionar certificados en /data; ver «pendientes» en DOCKER_PRODUCTION.md.
