name: CI

# Se ejecuta en cada PR. En los push a develop y master no se lanza por su cuenta:
# lo llama deploy.yml (workflow_call) y solo despliega si este CI pasa, así no
# se ejecuta dos veces por cada push.
on:
  pull_request:
  workflow_call:

# Un commit nuevo en el mismo PR o rama cancela la ejecución de CI en curso: no
# tiene sentido terminar de comprobar código que ya está desfasado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Misma versión de Node que los Dockerfile del repo (node:24-alpine) y que el
  # .nvmrc de la raíz; ver apps/server/Dockerfile y apps/storefront/Dockerfile. Si
  # cambia, actualiza los tres a la vez.
  NODE_VERSION: "24"

jobs:
  verify:
    name: Typecheck, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Solo hace falta para los pasos de migraciones, seed y build del storefront
    # (los tests unitarios del backend usan mocks en memoria, p. ej.
    # apps/server/src/plugins/redsys-payment/redsys.service.spec.ts; ninguno abre
    # una conexión real). Se deja para todo el job: un contenedor sin usar no cuesta nada.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vendure
          POSTGRES_USER: vendure
          POSTGRES_PASSWORD: vendure-ci-dummy-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendure -d vendure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Solo valores de prueba (ver la sección «secrets» del informe de la FASE 17).
    # Ninguno es una credencial real; los REDSYS_* son el comercio de pruebas que
    # publica Redsys (los mismos de .env.prod.example) y se pueden usar tal cual
    # contra sis-t.redsys.es.
    env:
      APP_ENV: dev
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: vendure
      DB_USERNAME: vendure
      DB_PASSWORD: vendure-ci-dummy-password
      DB_SCHEMA: public
      VENDURE_SERVER_PORT: "3000"
      COOKIE_SECRET: ci-dummy-cookie-secret
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: ci-dummy-admin-password-1
      REDSYS_MERCHANT_CODE: "999008881"
      REDSYS_TERMINAL: "1"
      REDSYS_SECRET_KEY: sq7HjrUOBfKmC576ILgskD5srU870gJ7
      REDSYS_ENVIRONMENT: test
      REDSYS_NOTIFICATION_URL: http://localhost:3000/payments/redsys/notify
      STOREFRONT_URL: http://localhost:3001
      INVOICE_STORE_NAME: CI Test Store
      INVOICE_STORE_TAX_ID: B00000000
      INVOICE_STORE_ADDRESS: Calle Ejemplo 1, 28001 Madrid, España
      INVOICE_STORE_EMAIL: facturacion@example.com
      EMAIL_ENABLED: "false"
      EMAIL_PROVIDER: dev
      EMAIL_FROM: "CI <no-reply@example.com>"
      VENDURE_SHOP_API_URL: http://localhost:3000/shop-api
      VENDURE_CHANNEL_TOKEN: __default_channel__
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_NAME: CI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cachea ~/.npm según package-lock.json, NO node_modules (el cache: npm de
          # actions/setup-node nunca lo hace; solo restaura la caché de descargas de
          # npm, así que `npm ci` se ejecuta de verdad y no puede servir un árbol
          # viejo o manipulado).
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- comprobación de tipos ----
      - name: Typecheck server
        run: npx tsc --noEmit -p apps/server/tsconfig.json

      - name: Typecheck storefront
        run: npm run check-types -w storefront

      # ---- lint ----
      # El servidor no tiene script de lint; solo el storefront
      # (apps/storefront/eslint.config.mjs impone las capas app/site/features,
      # incluido no-restricted-imports entre features).
      - name: Lint storefront
        run: npm run lint -w storefront

      # ---- tests ----
      - name: Backend tests
        run: npm run test -w server

      - name: Storefront tests
        run: npm run test -w storefront

      # ---- builds ----
      - name: Build server
        run: npm run build:server -w server

      - name: Build worker
        run: npm run build:worker -w server

      - name: Build dashboard
        run: npm run build:dashboard -w server

      # Aplica todas las migraciones a una base limpia y arranca el servidor
      # compilado real. Ese arranque es también el que crea el superadministrador
      # y el canal por defecto (lo hace Vendure en el primer arranque), que seed.ts
      # necesita que ya existan.
      - name: Run migrations and boot server against a clean DB
        run: |
          node apps/server/dist/index.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Server is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time. Log:"
          cat server.log
          exit 1

      - name: Run seed against the clean, migrated DB
        run: npm run seed -w server

      # Next.js prerenderiza varias páginas al compilar contra una Shop API real
      # (ver la nota al principio de apps/storefront/Dockerfile); la da el servidor
      # arrancado arriba, ya migrado y con el seed aplicado.
      - name: Build storefront
        run: npm run build -w storefront

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true

      # ---- comprobación de docker compose ----
      - name: Validate docker-compose.prod.yml
        run: |
          cp .env.prod.example .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet
          rm -f .env.ci
