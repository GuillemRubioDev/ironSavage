name: Build images

# Comprueba que las tres imágenes Docker de producción compilan. La del
# storefront necesita una Shop API de Vendure real y accesible durante
# `next build` (ver la nota al principio de apps/storefront/Dockerfile), así que
# este flujo levanta primero un Postgres y un vendure-server desechables, igual
# que la secuencia «Cómo arrancar» de docker-compose.prod.yml / DOCKER_PRODUCTION.md.
# Ningún valor de aquí es una credencial real (ver la sección «secrets» del
# informe de la FASE 17).
on:
  pull_request:
  push:
    branches: [develop, master]

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    name: Build vendure + storefront images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # packages: write solo hace falta para los pasos de publicación en GHCR
    # (hoy desactivados, ver abajo); se limita a este job y no a todo el repo,
    # igual que el `contents: read` de ci.yml.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Write CI env file
        # .env.prod.example está en el repo con valores de ejemplo y de pruebas
        # (el comercio de pruebas de Redsys, ningún secreto real): justo lo que
        # necesitan "docker compose config" y un arranque desechable. Nunca se usa
        # para nada accesible fuera de este job.
        run: cp .env.prod.example .env.ci

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet

      - name: Validate dev-server override
        # La combinación que usa scripts/deploy.sh en el servidor de desarrollo.
        run: docker compose -f docker-compose.prod.yml -f docker-compose.dev-server.yml --env-file .env.ci config --quiet

      - name: Validate Caddyfiles
        # `caddy adapt` solo traduce la configuración (no arranca nada ni pide
        # certificados): detecta errores de sintaxis en Caddyfile y Caddyfile.dev antes
        # de que lleguen a un servidor. Los dominios y el hash son valores de prueba.
        run: |
          for f in Caddyfile Caddyfile.dev; do
            docker run --rm \
              -e PUBLIC_DOMAIN=tienda.example.com -e API_DOMAIN=api.example.com \
              -e CADDY_EMAIL=ci@example.com -e DEV_BASIC_AUTH_USER=ci \
              -e 'DEV_BASIC_AUTH_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' \
              -v "$PWD/$f:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
            echo "$f OK"
          done

      - name: Build vendure-server image
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci build vendure-server

      - name: Build vendure-worker image
        # Mismo Dockerfile e imagen que vendure-server (docker-compose.prod.yml solo
        # cambia el CMD): sale de la caché; solo confirma que la definición del
        # servicio en compose compila.
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci build vendure-worker

      - name: Start postgres + vendure-server
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci up -d postgres vendure-server

      - name: Wait for vendure-server to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' tienda-suple-prod-vendure-server-1 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "vendure-server is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "vendure-server did not become healthy in time."
          docker compose -f docker-compose.prod.yml --env-file .env.ci logs vendure-server
          exit 1

      - name: Build storefront image
        # Debe compilarse en la misma red Docker que el vendure-server ya sano y con
        # el builder antiguo; el comentario de `network:` del servicio storefront en
        # docker-compose.prod.yml explica por qué (el builder por defecto de BuildKit
        # no permite unirse a una red con nombre). Es el mismo comando que
        # documenta DOCKER_PRODUCTION.md.
        run: |
          DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 \
            docker compose -f docker-compose.prod.yml --env-file .env.ci build storefront

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.ci down -v || true
          rm -f .env.ci

      # ---------------------------------------------------------------
      # Publicación en GitHub Container Registry: preparada, no activa.
      #
      # Aún no hay registro configurado, así que por defecto no se ejecuta nada
      # de lo de abajo: depende de la variable de repositorio `PUBLISH_IMAGES`,
      # que no existe hasta que alguien la cree (Settings → Secrets and
      # variables → Actions → Variables) con el valor "true". Hasta entonces
      # este job solo comprueba que las imágenes compilan, como el resto del flujo.
      #
      # Etiquetas cuando se active:
      #   ghcr.io/<owner>/<repo>/vendure:<git-sha>      (+ :latest en main/master)
      #   ghcr.io/<owner>/<repo>/storefront:<git-sha>   (+ :latest en main/master)
      # `vendure` cubre vendure-server y vendure-worker: son la misma imagen,
      # solo cambia el CMD (ver docker-compose.prod.yml).
      # ---------------------------------------------------------------
      - name: Compute image tags
        if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push'
        id: tags
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "vendure=ghcr.io/${repo_lc}/vendure" >> "$GITHUB_OUTPUT"
          echo "storefront=ghcr.io/${repo_lc}/storefront" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push vendure image
        if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push'
        run: |
          docker tag tienda-suple-prod-vendure-server "${{ steps.tags.outputs.vendure }}:${{ github.sha }}"
          docker tag tienda-suple-prod-vendure-server "${{ steps.tags.outputs.vendure }}:latest"
          docker push "${{ steps.tags.outputs.vendure }}:${{ github.sha }}"
          docker push "${{ steps.tags.outputs.vendure }}:latest"

      - name: Tag and push storefront image
        if: vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push'
        run: |
          docker tag tienda-suple-prod-storefront "${{ steps.tags.outputs.storefront }}:${{ github.sha }}"
          docker tag tienda-suple-prod-storefront "${{ steps.tags.outputs.storefront }}:latest"
          docker push "${{ steps.tags.outputs.storefront }}:${{ github.sha }}"
          docker push "${{ steps.tags.outputs.storefront }}:latest"
